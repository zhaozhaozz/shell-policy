policy:
  id: "default-ai-shell-policy"
  name: "Default AI Shell Policy"
  # Leaves no rule decided use the `default` action below.
  defaultAction: "default"
  # writableDirs is an operator-managed allowlist. Ordinary modifications
  # (write / append / delete / move / copy / mkdir / touch / git writes ...)
  # whose targets all fall inside one of these directories are auto-allowed
  # by the "allow-writable-dir-mutation" rule below. Leave empty to disable,
  # or supplement at runtime with the CLI `--writable <dir>` flag.
  # Example:
  #   writableDirs:
  #     - "/home/me/project/build"
  #     - "/home/me/project/.cache"
  writableDirs: []
  # sensitivePaths adds secret-like paths on top of the built-in list
  # (.env, .ssh/, *.pem, ...). Entries are path prefixes or globs matched per
  # path component: "~/.aws/", "*.key", "/etc/myapp/secrets/", ".npmrc".
  sensitivePaths: []

# Actions are grouped into categories. Each category below has exactly one
# named action, so a caller can switch a whole category between allow / ask /
# deny (for example ShellGate's simple settings) without editing rules:
#
#   ask_privilege                sudo / su / doas / pkexec
#   ask_write_outside_writable   write, delete, chmod outside writableDirs
#   deny_destructive             rm -rf on system paths, git push -f, mkfs ...
#   ask_sensitive_read           reading .env, private keys, credentials
#   ask_broad_read               grep -r / rg searches and globs such as cat *
#                                that may reach sensitive files unseen
#   deny_secret_exfiltration     sending secret-like data over the network
#   ask_network                  curl / wget / git fetch ...
#   ask_remote                   ssh, docker exec / run, kubectl exec
#   ask_package_manager          apt / pip / npm install ...
#   deny_inline_eval             python -c, node -e ...
#   default                      every command no rule decided
actions:
  allow:
    effectiveAction: "allow"
    severity: 0
  ask:
    effectiveAction: "ask"
    severity: 50
  deny:
    effectiveAction: "deny"
    severity: 100
  allow_readonly:
    effectiveAction: "allow"
    severity: 0
  default:
    effectiveAction: "ask"
    severity: 50
  ask_privilege:
    effectiveAction: "ask"
    severity: 65
  ask_write_outside_writable:
    effectiveAction: "ask"
    severity: 55
  ask_sensitive_read:
    effectiveAction: "ask"
    severity: 70
  ask_broad_read:
    effectiveAction: "ask"
    severity: 55
  ask_network:
    effectiveAction: "ask"
    severity: 60
  ask_remote:
    effectiveAction: "ask"
    severity: 65
  ask_package_manager:
    effectiveAction: "ask"
    severity: 60
  deny_destructive:
    effectiveAction: "deny"
    severity: 100
  deny_secret_exfiltration:
    effectiveAction: "deny"
    severity: 100
  deny_inline_eval:
    effectiveAction: "deny"
    severity: 95

# Deny and ask rules are non-terminal: every one that matches is recorded and
# the strongest wins, so switching one category to "ask" never hides another
# category's "deny" on the same command. Allow rules come after the deny/ask
# rules that must not be bypassed and only clear the operations they match.
rules:
  # ------------------------------------------------------------------
  # Phase 1 — Enrichment: tag and risk-score the leaf command.
  # ------------------------------------------------------------------
  - id: "mark-secret-path"
    mode: "enrich"
    order: 100
    match:
      path.secretCandidate:
        equals: true
    effects:
      addTags: ["secret_candidate"]
      addRisk: 50
      addAuditNote: "Command touches a secret-like path"
    terminal: false

  - id: "mark-network-write"
    mode: "enrich"
    order: 110
    match:
      operation.type:
        equals: "network_write"
    effects:
      addTags: ["uses_network", "network_write"]
      addRisk: 40
      addAuditNote: "Command sends data over network"
    terminal: false

  - id: "mark-network-read"
    mode: "enrich"
    order: 111
    match:
      operation.type:
        equals: "network_read"
    effects:
      addTags: ["uses_network", "network_read"]
      addRisk: 20
    terminal: false

  - id: "mark-remote-command"
    mode: "enrich"
    order: 120
    match:
      context.inRemoteCommand:
        equals: true
    effects:
      addTags: ["remote_command"]
      addRisk: 30
      addAuditNote: "Command is executed on a remote host"
    terminal: false

  - id: "mark-container-command"
    mode: "enrich"
    order: 130
    match:
      context.inContainerCommand:
        equals: true
    effects:
      addTags: ["container_command"]
      addRisk: 20
      addAuditNote: "Command is executed inside a container"
    terminal: false

  - id: "mark-privilege-escalation"
    mode: "enrich"
    order: 140
    match:
      context.privilegeEscalated:
        equals: true
    effects:
      addTags: ["privilege_escalated"]
      addRisk: 30
      addAuditNote: "Command runs with elevated privileges (sudo)"
    terminal: false

  - id: "mark-rm-recursive-force"
    mode: "enrich"
    order: 150
    match:
      all:
        - command.program:
            equals: "rm"
        - flags.recursive:
            equals: true
        - flags.force:
            equals: true
    effects:
      addTags: ["recursive_force_delete"]
      addRisk: 40
    terminal: false

  - id: "mark-dynamic-args-on-mutation"
    mode: "enrich"
    order: 160
    match:
      all:
        - command.hasDynamicArgs:
            equals: true
        - operation.type:
            in: ["file_delete", "file_write", "file_append", "file_chmod", "file_chown", "file_move"]
    effects:
      addTags: ["dynamic_destructive"]
      addRisk: 50
      addAuditNote: "Mutating command has dynamic arguments — value not statically known"
    terminal: false

  # ------------------------------------------------------------------
  # Phase 2 — Denies: destructive operations, exfiltration, inline eval.
  # ------------------------------------------------------------------
  - id: "deny-secret-exfiltration"
    mode: "decide"
    order: 1000
    match:
      all:
        - tags:
            contains: "secret_candidate"
        - tags:
            contains: "network_write"
    action: "deny_secret_exfiltration"
    reason: "Secret-like data may be sent over network"
    terminal: false

  - id: "deny-rm-system-root"
    mode: "decide"
    order: 1010
    match:
      all:
        - command.program:
            equals: "rm"
        - flags.recursive:
            equals: true
        - path.scope:
            in: ["system"]
    action: "deny_destructive"
    reason: "Recursive removal targeting system path"
    terminal: false

  - id: "deny-dynamic-recursive-force-rm"
    mode: "decide"
    order: 1020
    match:
      all:
        - command.program:
            equals: "rm"
        - flags.recursive:
            equals: true
        - flags.force:
            equals: true
        - command.hasDynamicArgs:
            equals: true
    action: "deny_destructive"
    reason: "rm -rf with dynamic arguments cannot be statically validated"
    terminal: false

  - id: "deny-chmod-recursive-system"
    mode: "decide"
    order: 1030
    match:
      all:
        - command.program:
            in: ["chmod", "chown"]
        - flags.recursive:
            equals: true
        - path.scope:
            equals: "system"
    action: "deny_destructive"
    reason: "Recursive permission change on system path"
    terminal: false

  - id: "deny-git-push-force"
    mode: "decide"
    order: 1040
    match:
      all:
        - command.program:
            equals: "git"
        - command.subcommand:
            equals: ["git", "push"]
        - flags.force:
            equals: true
    action: "deny_destructive"
    reason: "git push --force is denied by default"
    terminal: false

  - id: "deny-git-clean-fdx"
    mode: "decide"
    order: 1050
    match:
      all:
        - command.program:
            equals: "git"
        - command.subcommand:
            equals: ["git", "clean"]
        - flags.forceDirsX:
            equals: true
    action: "deny_destructive"
    reason: "git clean -fdx is denied by default"
    terminal: false

  - id: "deny-block-device-write"
    mode: "decide"
    order: 1060
    match:
      all:
        - operation.type:
            in: ["file_write", "file_append", "file_delete", "file_move", "file_chmod", "file_chown"]
        - path.absolute:
            regex: "^/dev/(sd|hd|vd|xvd|nvme|mmcblk|disk|loop|md|dm-|mapper/)"
    action: "deny_destructive"
    reason: "Writing to a block device destroys its data"
    terminal: false

  - id: "deny-disk-format"
    mode: "decide"
    order: 1070
    match:
      command.program:
        regex: "^(mkfs(\\..+)?|mke2fs|mkswap|wipefs|fdisk|sfdisk|cfdisk|parted|sgdisk)$"
    action: "deny_destructive"
    reason: "Formatting or partitioning disks is denied by default"
    terminal: false

  - id: "deny-inline-eval"
    mode: "decide"
    order: 1080
    match:
      command.wrapperType:
        equals: "language_eval"
    action: "deny_inline_eval"
    reason: "Inline language evaluation (python/node/perl/ruby -e/-c) is denied by default"
    terminal: false

  - id: "deny-high-risk"
    mode: "decide"
    order: 1090
    match:
      riskScore:
        greaterThanOrEqual: 100
    action: "deny_destructive"
    reason: "Aggregated risk score is too high"
    terminal: false

  # ------------------------------------------------------------------
  # Phase 3 — Asks that no allow rule may override.
  # ------------------------------------------------------------------
  - id: "ask-privilege"
    mode: "decide"
    order: 1100
    match:
      any:
        - context.privilegeEscalated:
            equals: true
        - command.program:
            in: ["sudo", "su", "doas", "pkexec"]
    action: "ask_privilege"
    reason: "Running with elevated privileges requires approval"
    terminal: false

  - id: "ask-remote-command"
    mode: "decide"
    order: 1110
    match:
      any:
        - context.inRemoteCommand:
            equals: true
        - operation.type:
            equals: "remote_exec"
    action: "ask_remote"
    reason: "Remote command requires approval"
    terminal: false

  - id: "ask-container-exec"
    mode: "decide"
    order: 1120
    match:
      any:
        - context.inContainerCommand:
            equals: true
        - command.wrapperType:
            in: ["docker_exec", "docker_run", "kubectl_exec"]
    action: "ask_remote"
    reason: "Running a command in a container requires approval"
    terminal: false

  - id: "ask-shell-config"
    mode: "decide"
    order: 1130
    match:
      any:
        - operation.type:
            equals: "shell_config"
        - context.inFunction:
            equals: true
    action: "ask"
    reason: "Changing PATH, aliases, traps or defining functions changes what later commands run"
    terminal: false

  # Only an exit in the shell itself ends the session; `(exit 3)` or
  # `$(exit 1)` leave it running.
  - id: "ask-shell-exit"
    mode: "decide"
    order: 1140
    match:
      all:
        - command.program:
            in: ["exit", "logout"]
        - context.inSubshell:
            equals: false
        - context.inCommandSubstitution:
            equals: false
    action: "ask"
    reason: "Exiting the shell ends the session"
    terminal: false

  # ------------------------------------------------------------------
  # Phase 4 — Allow ordinary work inside the workspace and writable dirs.
  # ------------------------------------------------------------------
  - id: "allow-writable-dir-mutation"
    mode: "decide"
    order: 4900
    match:
      all:
        - operation.type:
            in: ["file_write", "file_append", "file_delete", "file_move", "file_copy", "file_chmod", "file_chown", "git_write"]
        - path.writable:
            equals: true
        - path.secretCandidate:
            equals: false
        - command.hasDynamicArgs:
            equals: false
        - context.inRemoteCommand:
            equals: false
        - context.inContainerCommand:
            equals: false
        - context.privilegeEscalated:
            equals: false
    effects:
      addTags: ["writable_mutation"]
    action: "allow"
    reason: "Ordinary modification inside a configured writable directory"
    terminal: true

  # Allow rules only clear the operations they match, so the read side of
  # `cp src/a build/` or `sed -i ... build/x` needs its own rule: workspace
  # reads that feed a modification inside a writable directory.
  - id: "allow-writable-dir-mutation-source"
    mode: "decide"
    order: 4910
    match:
      all:
        - tags:
            contains: "writable_mutation"
        - operation.type:
            in: ["file_read", "file_list", "file_read_metadata"]
        - path.scope:
            in: ["inside_workspace", "tmp"]
        - path.secretCandidate:
            equals: false
        - command.hasDynamicArgs:
            equals: false
        - context.inRemoteCommand:
            equals: false
        - context.inContainerCommand:
            equals: false
        - context.privilegeEscalated:
            equals: false
    action: "allow"
    reason: "Workspace source of a modification inside a configured writable directory"
    terminal: true

  - id: "allow-bash-readonly"
    mode: "decide"
    order: 5000
    match:
      all:
        - command.program:
            in: ["ls", "cat", "head", "tail", "stat", "file", "grep", "egrep", "fgrep", "rg"]
        - operation.type:
            in: ["file_read", "file_list", "file_read_metadata"]
        - path.scope:
            in: ["inside_workspace", "tmp"]
        - path.secretPossible:
            equals: false
        - command.hasDynamicArgs:
            equals: false
        - command.hasAssignments:
            equals: false
        - context.inRemoteCommand:
            equals: false
        - context.inContainerCommand:
            equals: false
        - context.privilegeEscalated:
            equals: false
    action: "allow_readonly"
    terminal: true

  - id: "allow-git-readonly"
    mode: "decide"
    order: 5010
    match:
      all:
        - command.program:
            equals: "git"
        - operation.type:
            equals: "git_read"
        - command.hasAssignments:
            equals: false
        - context.inRemoteCommand:
            equals: false
        - context.inContainerCommand:
            equals: false
        - context.privilegeEscalated:
            equals: false
    action: "allow_readonly"
    terminal: true

  - id: "allow-docker-readonly"
    mode: "decide"
    order: 5020
    match:
      all:
        - command.program:
            in: ["docker", "podman"]
        - operation.type:
            equals: "container_read"
        - command.hasAssignments:
            equals: false
        - context.inRemoteCommand:
            equals: false
        - context.inContainerCommand:
            equals: false
        - context.privilegeEscalated:
            equals: false
    action: "allow_readonly"
    terminal: true

  # Builtins with no file, network or process effect: cd, pwd, echo, export
  # of ordinary variables ... A redirect on them is a separate operation that
  # the rules above or below decide.
  - id: "allow-shell-builtin"
    mode: "decide"
    order: 5030
    match:
      all:
        - command.program:
            in: ["cd", "chdir", "pushd", "popd", "dirs", "pwd", "echo", "printf", "true", "false", ":",
                 "test", "[", "[[", "((", "let", "export", "declare", "typeset", "readonly", "local",
                 "unset", "alias", "trap", "hash", "wait", "jobs"]
        - operation.type:
            exists: false
        - context.inRemoteCommand:
            equals: false
        - context.inContainerCommand:
            equals: false
        - context.privilegeEscalated:
            equals: false
    action: "allow_readonly"
    reason: "Shell builtin without side effects"
    terminal: true

  # ------------------------------------------------------------------
  # Phase 5 — Asks for medium-risk operations nothing above allowed.
  # ------------------------------------------------------------------
  - id: "ask-secret-read"
    mode: "decide"
    order: 6000
    match:
      all:
        - tags:
            contains: "secret_candidate"
        - operation.type:
            in: ["file_read", "file_read_metadata"]
    action: "ask_sensitive_read"
    reason: "Reading a secret-like file requires approval"
    terminal: false

  # The same reads as allow-bash-readonly, except that the files read are
  # not statically known: a recursive search (grep -r, rg) or a glob that
  # can expand to a secret-like name (cat * may read demo.key). Its own
  # category, so it can be allowed without allowing sensitive reads.
  - id: "ask-broad-read"
    mode: "decide"
    order: 6005
    match:
      all:
        - command.program:
            in: ["cat", "head", "tail", "grep", "egrep", "fgrep", "rg"]
        - operation.type:
            equals: "file_read"
        - path.secretPossible:
            equals: true
        - path.scope:
            in: ["inside_workspace", "tmp"]
        - command.hasDynamicArgs:
            equals: false
        - command.hasAssignments:
            equals: false
        - context.inRemoteCommand:
            equals: false
        - context.inContainerCommand:
            equals: false
        - context.privilegeEscalated:
            equals: false
    action: "ask_broad_read"
    reason: "The read may reach sensitive files the command does not name (recursive search or broad glob)"
    terminal: false

  - id: "ask-network-write"
    mode: "decide"
    order: 6010
    match:
      operation.type:
        equals: "network_write"
    action: "ask_network"
    reason: "Network write requires approval"
    terminal: false

  - id: "ask-network-read"
    mode: "decide"
    order: 6020
    match:
      operation.type:
        equals: "network_read"
    action: "ask_network"
    reason: "Network read requires approval"
    terminal: false

  - id: "ask-package-manager"
    mode: "decide"
    order: 6030
    match:
      operation.type:
        equals: "package_install"
    action: "ask_package_manager"
    reason: "Installing or removing packages requires approval"
    terminal: false

  # Mutations the writable-dir rule did not allow: outside writableDirs, in
  # an unknown directory, on a sensitive file or with dynamic arguments.
  - id: "ask-write-outside-writable"
    mode: "decide"
    order: 6050
    match:
      operation.type:
        in: ["file_write", "file_append", "file_delete", "file_move", "file_copy", "file_chmod", "file_chown", "git_write"]
    action: "ask_write_outside_writable"
    reason: "Modification outside the writable directories requires approval"
    terminal: false
